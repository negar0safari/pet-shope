<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>سبد خرید</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#3E2723] via-[#5D4037] to-[#C68B5E] text-white">

  <div class="max-w-7xl mx-auto p-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-10">
      <div>
        <h1 class="text-4xl font-bold">سبد خرید</h1>
        <p class="text-white/70 mt-2">محصولات انتخاب‌شده شما</p>
      </div>

      <button class="bg-white/10 hover:bg-white/20 border border-white/20 px-5 py-3 rounded-2xl transition">
        ادامه خرید
      </button> 
    </div>

    <div class="grid lg:grid-cols-3 gap-8">

      <!-- Products -->
      <div class="lg:col-span-2 space-y-5">

        <!-- Item -->
        <div class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl p-5 flex flex-col md:flex-row gap-5 items-center">

          <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
            class="w-32 h-32 object-cover rounded-2xl"
            alt=""
          />

          <div class="flex-1 w-full">

            <div class="flex items-start justify-between gap-4">
              <div>
                <h2 class="text-xl font-bold">کتونی اسپرت</h2>
                <p class="text-white/60 text-sm mt-1">رنگ: سفید | سایز: 42</p>
              </div>

              <button class="text-red-300 hover:text-red-200 text-sm">
                حذف
              </button>
            </div>

            <div class="flex items-center justify-between mt-6">

              <div class="flex items-center bg-white/10 border border-white/20 rounded-2xl overflow-hidden">
                <button class="px-4 py-2 hover:bg-white/10">+</button>
                <span class="px-4">1</span>
                <button class="px-4 py-2 hover:bg-white/10">-</button>
              </div>

              <p class="text-2xl font-bold text-[#FFD6A5]">
                ۲,۴۵۰,۰۰۰ تومان
              </p>

            </div>
          </div>
        </div>

        <!-- Item -->
        <div class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl p-5 flex flex-col md:flex-row gap-5 items-center">

          <img
            src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518"
            class="w-32 h-32 object-cover rounded-2xl"
            alt=""
          />

          <div class="flex-1 w-full">

            <div class="flex items-start justify-between gap-4">
              <div>
                <h2 class="text-xl font-bold">تیشرت اورجینال</h2>
                <p class="text-white/60 text-sm mt-1">رنگ: مشکی | سایز: L</p>
              </div>

              <button class="text-red-300 hover:text-red-200 text-sm">
                حذف
              </button>
            </div>

            <div class="flex items-center justify-between mt-6">

              <div class="flex items-center bg-white/10 border border-white/20 rounded-2xl overflow-hidden">
                <button class="px-4 py-2 hover:bg-white/10">+</button>
                <span class="px-4">2</span>
                <button class="px-4 py-2 hover:bg-white/10">-</button>
              </div>

              <p class="text-2xl font-bold text-[#FFD6A5]">
                ۱,۳۰۰,۰۰۰ تومان
              </p>

            </div>
          </div>
        </div>

      </div>

      <!-- Summary -->
      <div class="h-fit backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl p-6 sticky top-6">

        <h2 class="text-2xl font-bold mb-6">
          خلاصه سفارش
        </h2>

        <div class="space-y-4 text-white/80">

          <div class="flex justify-between">
            <span>جمع محصولات</span>
            <span>۵,۰۵۰,۰۰۰ تومان</span>
          </div>

          <div class="flex justify-between">
            <span>هزینه ارسال</span>
            <span>رایگان</span>
          </div>

          <div class="border-t border-white/20 pt-4 flex justify-between text-xl font-bold text-white">
            <span>مبلغ نهایی</span>
            <span class="text-[#FFD6A5]">۵,۰۵۰,۰۰۰ تومان</span>
          </div>

        </div>

        <button class="w-full mt-8 py-4 rounded-2xl bg-[#E6B17E] hover:bg-[#f0be8f] text-[#3E2723] font-bold text-lg transition shadow-xl">
          ادامه فرآیند خرید
        </button>

        <div class="mt-5 text-center text-sm text-white/60">
          پرداخت امن و سریع
        </div>

      </div>

    </div>
  </div>

</body>
</html>
